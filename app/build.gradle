plugins { id 'com.android.application' }
android {
    namespace 'dev.aurora.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.aurora.tv'
        minSdk 22
        targetSdk 28
        versionCode 6
        versionName '0.3.1'
    }
    // Sideload-only Fire OS app: Homestead's activity handoff relies on API 28 behavior.
    // Do not suppress other lint checks.
    lint { disable 'ExpiredTargetSdkVersion' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
